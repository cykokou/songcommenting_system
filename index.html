<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Verse - 音樂交流留言板</title>
    <style>
        /* --- 搖滾專業風 CSS 樣式 --- */
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --card-hover: #252525;
            --primary-color: #ff3e3e;
            --primary-hover: #e03535;
            --text-color: #e0e0e0;
            --text-muted: #888888;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            /* 搖滾微網格背景 */
            background-image: linear-gradient(rgba(255, 62, 62, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 62, 62, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 62, 62, 0.5);
        }

        header p {
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* 表單樣式 */
        .form-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            background-color: #151515;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        /* 5. 音樂類型分區 (凜秀 / MCR 示範) */
        .genre-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .tab {
            padding: 8px 16px;
            background: #222;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .tab.active, .tab:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 資料視覺化區塊 */
        .chart-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #fff;
        }

        .bar-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .bar-label {
            width: 180px;
            font-size: 0.85rem;
            color: var(--text-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bar-track {
            flex-grow: 1;
            background-color: #151515;
            height: 15px;
            border-radius: 3px;
            margin: 0 10px;
            overflow: hidden;
        }

        .bar-fill {
            background: linear-gradient(90deg, var(--primary-color), #ff7676);
            height: 100%;
            width: 0%;
            transition: width 0.6s ease-out;
        }

        .bar-value {
            font-size: 0.85rem;
            color: var(--text-muted);
            width: 25px;
            text-align: right;
        }

        /* 留言卡片列表 */
        .records-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .comment-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
        }

        .comment-card:hover {
            transform: translateY(-2px);
            background-color: var(--card-hover);
            box-shadow: 0 6px 12px rgba(255, 62, 62, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
        }

        /* 7. 留言者可改名輸入框 */
        .author-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            padding: 2px 5px;
            width: 150px;
            transition: border-color 0.3s, background 0.3s;
        }

        .author-input:focus {
            background: #111;
            border-bottom: 1px solid var(--primary-color);
            outline: none;
        }

        .genre-badge {
            background-color: #333;
            color: #aaa;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .comment-content {
            font-size: 1rem;
            color: #ddd;
            margin-bottom: 15px;
            word-break: break-word;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Status Toggle 開關 */
        .status-toggle-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .status-label {
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Rock Verse</h1>
            <p>高中音樂研究社留言板（凛として時雨 / MCR 熱烈推廣中）</p>
        </header>

        <div class="form-section">
            <form id="commentForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="inputAuthor">留言者名稱</label>
                    <input type="text" id="inputAuthor" required placeholder="例如：搖滾阿高">
                </div>
                <div class="form-group">
                    <label for="selectGenre">音樂分區 / 類型</label>
                    <select id="selectGenre" required>
                        <option value="凛として時雨">凛として時雨 (Math Rock / J-Rock)</option>
                        <option value="My Chemical Romance">My Chemical Romance (Emo / Punk)</option>
                        <option value="Classic Rock">Classic Rock (經典搖滾)</option>
                        <option value="Heavy Metal">Heavy Metal (重金屬)</option>
                        <option value="Alternative">Alternative (另類搖滾)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="inputContent">留言內容</label>
                    <textarea id="inputContent" rows="3" required placeholder="分享你對這首歌或樂團的看法..."></textarea>
                </div>
                <button type="submit">發送搖滾宣言</button>
            </form>
        </div>

        <div class="chart-section">
            <div class="chart-title">📊 樂團/曲風討論熱度統計</div>
            <div id="visualizationContainer">
                </div>
        </div>

        <div class="genre-tabs" id="genreTabs">
            <div class="tab active" onclick="filterGenre('All')">全部全部</div>
            <div class="tab" onclick="filterGenre('凛として時雨')">凛として時雨</div>
            <div class="tab" onclick="filterGenre('My Chemical Romance')">My Chemical Romance</div>
            <div class="tab" onclick="filterGenre('Classic Rock')">Classic Rock</div>
            <div class="tab" onclick="filterGenre('Heavy Metal')">Heavy Metal</div>
            <div class="tab" onclick="filterGenre('Alternative')">Alternative</div>
        </div>

        <div class="records-list" id="recordsContainer">
            </div>
    </div>

    <script>
        // 固定後端網址
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw730I96FUMd6EeXjCEgSi8M38dDe27j1_Oz0tm3PjQnHLG2RkcpqDACtyr09WDaelG9A/exec";
        
        // 全域資料快取與過濾狀態
        let allRecords = [];
        let currentFilterGenre = "All";

        // 網頁載入後自動讀取資料
        window.addEventListener('DOMContentLoaded', loadData);

        // --- 1. Load Data (讀取) ---
        function loadData() {
            fetch(APPS_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    // 假設後端回傳的陣列在 data 或 data.records 中
                    allRecords = Array.isArray(data) ? data : (data.records || []);
                    renderRecords(allRecords);
                    renderVisualization(allRecords);
                })
                .catch(err => console.error("讀取資料失敗:", err));
        }

        // --- 2. Render Records (渲染面板與過濾邏輯) ---
        function renderRecords(records) {
            const container = document.getElementById('recordsContainer');
            container.innerHTML = '';

            records.forEach(item => {
                // 4. 增加功能：自動隱藏（Hide）已被標記為刪除的留言 (防呆機制)
                if (item.isDeleted === true || item.isDeleted === "true") {
                    return; 
                }

                // 5. 音樂類型分區前端過濾篩選
                if (currentFilterGenre !== "All" && item.genre !== currentFilterGenre) {
                    return;
                }

                // 建立卡片元素
                const card = document.createElement('div');
                card.className = 'comment-card';
                
                // 解析狀態 (預設為 '已核准' 或 true/false 形式)
                const isApproved = item.status === undefined ? true : (item.status === true || item.status === "true" || item.status === "已核准");

                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <input type="text" class="author-input" value="${item.author || '無名搖滾客'}" 
                                onblur="updateAuthorName('${item.id}', this.value)" title="點擊可直接修改暱稱">
                        </div>
                        <span class="genre-badge">${item.genre || '未分類'}</span>
                    </div>
                    <div class="comment-content">${item.content || ''}</div>
                    <div class="card-footer">
                        <span>${item.timestamp ? new Date(item.timestamp).toLocaleString() : ''}</span>
                        
                        <div class="status-toggle-container">
                            <span class="status-label">${isApproved ? '🎵 演出中' : '💤 休息中'}</span>
                            <label class="switch">
                                <input type="checkbox" ${isApproved ? 'checked' : ''} 
                                    onchange="toggleStatus('${item.id}', ${isApproved})">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- 3. 資料視覺化渲染 (Pure HTML/CSS) ---
        function renderVisualization(records) {
            const chartContainer = document.getElementById('visualizationContainer');
            chartContainer.innerHTML = '';

            // 統計各類型的數量
            const genres = ['凛として時雨', 'My Chemical Romance', 'Classic Rock', 'Heavy Metal', 'Alternative'];
            const counts = {};
            genres.forEach(g => counts[g] = 0);
            
            let maxCount = 0;
            records.forEach(item => {
                if (counts[item.genre] !== undefined && !(item.isDeleted === true || item.isDeleted === "true")) {
                    counts[item.genre]++;
                    if (counts[item.genre] > maxCount) {
                        maxCount = counts[item.genre];
                    }
                }
            });

            // 繪製條形圖
            genres.forEach(g => {
                const count = counts[g];
                const percentage = maxCount > 0 ? (count / maxCount) * 100 : 0;

                const row = document.createElement('div');
                row.className = 'bar-container';
                row.innerHTML = `
                    <div class="bar-label">${g}</div>
                    <div class="bar-track">
                        <div class="bar-fill" style="width: ${percentage}%"></div>
                    </div>
                    <div class="bar-value">${count}</div>
                `;
                chartContainer.appendChild(row);
            });
        }

        // --- 4. 表單提交處理與 Save ---
        function handleFormSubmit(event) {
            event.preventDefault();
            const author = document.getElementById('inputAuthor').value;
            const genre = document.getElementById('selectGenre').value;
            const content = document.getElementById('inputContent').value;
            const id = 'id_' + Date.now(); // 產生唯一ID

            const newRecord = {
                id: id,
                author: author,
                genre: genre,
                content: content,
                status: "已核准",
                isDeleted: false,
                timestamp: new Date().toISOString()
            };

            // 先在前端畫面上即時顯示
            allRecords.unshift(newRecord);
            renderRecords(allRecords);
            renderVisualization(allRecords);

            // 清空輸入框
            document.getElementById('inputContent').value = '';

            // 同步寫入後端資料庫
            syncToSheet({
                action: "insert",
                record: newRecord
            });
        }

        // --- 5. 狀態切換功能 (Status Toggle) ---
        function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus ? "休息中" : "已核准";
            
            // 找尋全域暫存並更新前端顯示
            const record = allRecords.find(item => item.id === id);
            if (record) {
                record.status = newStatus;
                renderRecords(allRecords);
            }

            // 嚴格遵守規範 4：更新 record 之後必須呼叫 syncToSheet
            syncToSheet({ 
                action: "update", 
                id: id, 
                changes: { status: newStatus } 
            });
        }

        // --- 6. 留言者姓名修改功能 ---
        function updateAuthorName(id, newName) {
            if (!newName.trim()) return;

            const record = allRecords.find(item => item.id === id);
            if (record && record.author !== newName) {
                record.author = newName;
                // 同步更新視覺化和列表
                renderRecords(allRecords);
                
                // 同步到 Google Sheet
                syncToSheet({
                    action: "update",
                    id: id,
                    changes: { author: newName }
                });
            }
        }

        // --- 7. 前端分區 Filter 切換控制 ---
        function filterGenre(genreName) {
            currentFilterGenre = genreName;
            
            // 切換 Tab 活躍狀態外觀
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                if (tab.innerText === genreName || (genreName === 'All' && tab.innerText === '全部全部')) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });
            
            renderRecords(allRecords);
        }

        // --- 8. Sync To Sheet (後端資料庫同步核心) ---
        function syncToSheet(payload) {
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // 配合 Google Apps Script 跨網域常規設定
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                console.log("後端同步成功:", payload.action);
                // 為了確保資料精準，可視情況在 insert 後重新 loadData()
            })
            .catch(err => console.error("後端同步失敗:", err));
        }
    </script>
</body>
</html>
